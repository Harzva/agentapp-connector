  <text x="252" y="128" font-family="-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="52" font-weight="700" fill="#F4F6FB">agentapp-connector</text>
  <text x="254" y="172" font-family="-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="24" font-weight="600" fill="url(#accent)">把任何应用，接入每一个 Agent 平台。</text>
  <text x="254" y="204" font-family="-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15.5" fill="#8B94B8">一份应用档案 → 本地配置 · 市场材料 · 平台体检  |  One app profile → configs, kits &amp; preflight</text>

