      <stop stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#111736"/>
      <stop offset="1" stop-color="#0D1B2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="150" y1="60" x2="1100" y2="240" gradientUnits="userSpaceOnUse">
