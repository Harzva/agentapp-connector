* { margin:0; padding:0; box-sizing:border-box; }
html { overflow:hidden; }

.hub .arm { position:absolute; background:#fff; border-radius:3px; }
.hub .a1 { left:-8px; top:-8px; width:38px; height:7px; transform:rotate(-45deg); transform-origin:center; }
.hub .a2 { right:-8px; top:-8px; width:38px; height:7px; transform:rotate(45deg); transform-origin:center; }
.hub .a3 { left:-8px; bottom:-8px; width:38px; height:7px; transform:rotate(45deg); transform-origin:center; }
.hub .a4 { right:-8px; bottom:-8px; width:38px; height:7px; transform:rotate(-45deg); transform-origin:center; }
.hub .dot { position:absolute; width:15px; height:15px; border-radius:50%; background:#fff; }
.title h1 { font-size:38px; font-weight:800; letter-spacing:.2px; }
.title .cn { font-size:17.5px; font-weight:700; margin-top:3px;

.title .en { font-size:11px; color:#8B94B8; margin-top:4px; }
.chips { position:absolute; left:34px; right:34px; top:158px; display:flex; gap:9px; }
.chip { flex:1; height:76px; border-radius:14px; background:rgba(23,30,58,.82);
  border:1px solid rgba(129,140,248,.32); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:6px;
  box-shadow:0 4px 18px rgba(0,0,0,.28); }
.chip img { width:30px; height:30px; }
.chip .nm { font-size:12px; font-weight:700; color:#E7ECFF; white-space:nowrap; }
.chip .vd { font-size:9px; color:#8B94B8; margin-top:-3px; white-space:nowrap; }
.stats { position:absolute; left:34px; right:34px; top:250px; display:flex; justify-content:center; gap:10px; }
.pill { padding:5px 14px; border-radius:999px; background:rgba(99,102,241,.14);
  border:1px solid rgba(129,140,248,.3); font-size:11.5px; color:#C7CFEA; font-weight:600; }
